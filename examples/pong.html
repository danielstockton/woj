<!DOCTYPE html>
<html>
<head>
  <title>woj Pong</title>
  <style>
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Courier New', monospace;
    }
    h1 {
      color: #eee;
      margin-bottom: 10px;
    }
    #game {
      border: 2px solid #444;
      background: #000;
    }
    .controls {
      color: #888;
      margin-top: 15px;
      text-align: center;
    }
    .controls span {
      margin: 0 20px;
    }
  </style>
</head>
<body>
  <h1>woj Pong</h1>
  <canvas id="game" width="800" height="600"></canvas>
  <div class="controls">
    <span>Left Player: W/S</span>
    <span>Right Player: Arrow Up/Down</span>
  </div>

  <script>
    const SCALE = 100; // Coordinates in WASM are scaled x100

    // Game constants (must match pong.clj)
    const WIDTH = 800;
    const HEIGHT = 600;
    const PADDLE_HEIGHT = 100;
    const PADDLE_WIDTH = 10;
    const BALL_SIZE = 10;

    let wasm = null;
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Track key states
    const keys = {
      w: false,
      s: false,
      ArrowUp: false,
      ArrowDown: false
    };

    // Load WASM module
    async function loadWasm() {
      try {
        const response = await fetch('pong.wasm');
        const bytes = await response.arrayBuffer();
        const result = await WebAssembly.instantiate(bytes, {});
        wasm = result.instance.exports;
        console.log('WASM loaded, exports:', Object.keys(wasm));

        // Initialize game
        wasm.init();

        // Start game loop
        requestAnimationFrame(gameLoop);
      } catch (err) {
        console.error('Failed to load WASM:', err);
        ctx.fillStyle = '#fff';
        ctx.font = '20px monospace';
        ctx.fillText('Failed to load pong.wasm', 250, 300);
        ctx.fillText('Run: ./build-pong.sh', 280, 330);
      }
    }

    // Handle keyboard input
    document.addEventListener('keydown', (e) => {
      if (e.key in keys) {
        keys[e.key] = true;
        e.preventDefault();
      }
    });

    document.addEventListener('keyup', (e) => {
      if (e.key in keys) {
        keys[e.key] = false;
        e.preventDefault();
      }
    });

    // Update input state in WASM
    function updateInput() {
      // Left paddle: W = up (-1), S = down (1)
      let leftInput = 0;
      if (keys.w) leftInput = -1;
      else if (keys.s) leftInput = 1;
      wasm['set-left-input'](leftInput);

      // Right paddle: ArrowUp = up (-1), ArrowDown = down (1)
      let rightInput = 0;
      if (keys.ArrowUp) rightInput = -1;
      else if (keys.ArrowDown) rightInput = 1;
      wasm['set-right-input'](rightInput);
    }

    // Render the game
    function render() {
      // Clear canvas
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // Draw center line
      ctx.strokeStyle = '#333';
      ctx.setLineDash([10, 10]);
      ctx.beginPath();
      ctx.moveTo(WIDTH / 2, 0);
      ctx.lineTo(WIDTH / 2, HEIGHT);
      ctx.stroke();
      ctx.setLineDash([]);

      // Get state from WASM (divide by SCALE)
      const ballX = wasm['get-ball-x']() / SCALE;
      const ballY = wasm['get-ball-y']() / SCALE;
      const paddleLeft = wasm['get-paddle-left']() / SCALE;
      const paddleRight = wasm['get-paddle-right']() / SCALE;
      const scoreLeft = wasm['get-score-left']();
      const scoreRight = wasm['get-score-right']();

      // Draw paddles (white rectangles)
      ctx.fillStyle = '#fff';

      // Left paddle (x=0, centered on paddleLeft)
      ctx.fillRect(0, paddleLeft - PADDLE_HEIGHT / 2, PADDLE_WIDTH, PADDLE_HEIGHT);

      // Right paddle (x=WIDTH-PADDLE_WIDTH, centered on paddleRight)
      ctx.fillRect(WIDTH - PADDLE_WIDTH, paddleRight - PADDLE_HEIGHT / 2, PADDLE_WIDTH, PADDLE_HEIGHT);

      // Draw ball (white square, centered on ballX, ballY)
      ctx.fillRect(ballX - BALL_SIZE / 2, ballY - BALL_SIZE / 2, BALL_SIZE, BALL_SIZE);

      // Draw scores
      ctx.fillStyle = '#fff';
      ctx.font = '48px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(scoreLeft.toString(), WIDTH / 4, 60);
      ctx.fillText(scoreRight.toString(), (WIDTH * 3) / 4, 60);
    }

    // Main game loop
    function gameLoop() {
      updateInput();
      wasm.tick();
      render();
      requestAnimationFrame(gameLoop);
    }

    // Start
    loadWasm();
  </script>
</body>
</html>
